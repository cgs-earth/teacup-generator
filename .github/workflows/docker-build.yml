name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - add-R-workflow
    paths:
      - 'R-workflow/rezviz_data_generator.R'
      - 'R-workflow/backfill_history.R'
      - 'R-workflow/revision_sweep.R'
      - 'R-workflow/helper_functions.R'
      - 'R-workflow/create_locations_geojson.R'
      - 'R-workflow/data/reference/**'
      - 'R-workflow/config/locations.csv'
      - 'R-workflow/config/locations.geojson'
      - 'R-workflow/output/historical_statistics.parquet'
      - 'R-workflow/output/historical_baseline.parquet'
      - 'R-workflow/Dockerfile'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Regenerate locations.geojson from locations.csv
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/R-workflow:/app" -w /app rocker/geospatial:4.4.2 \
            Rscript create_locations_geojson.R

      - name: Verify locations.geojson is up to date
        run: |
          if ! git diff --exit-code -- R-workflow/config/locations.geojson; then
            echo "::error::Regenerate locations.geojson on the source branch and include it in the PR before merging."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./R-workflow
          push: true
          tags: |
            ghcr.io/cgs-earth/rezviz:latest
            ghcr.io/cgs-earth/rezviz:${{ github.sha }}
